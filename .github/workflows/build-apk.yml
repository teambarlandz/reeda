name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: x86_64
            rust_target: x86_64-linux-android

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install cargo-apk
        run: cargo install cargo-apk cargo-ndk --locked

      - name: Build debug APK (platform-android)
        run: cargo apk build -p reeda-ui --no-default-features --features platform-android

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find target -name "*.apk" -exec cp {} artifacts/ \;

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.apk > sha256sums.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reeda-debug-${{ matrix.abi }}
          path: artifacts/
          retention-days: 30

  tts-bridge:
    name: TTS bridge compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Check JNI bridge for Android target
        run: cargo check -p reeda-tts --no-default-features --features platform-android --target aarch64-linux-android
