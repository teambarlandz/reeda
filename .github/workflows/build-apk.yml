name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# APKs are built and signed locally (scripts/build_apk.ps1) and shipped via
# GitHub Releases (docs/RELEASE.md); CI's job here is compile-checking the
# Android targets so the JNI bridge / app shell cannot rot unnoticed.
jobs:
  check-android:
    name: Android target compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype-dev libexpat1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Android NDK + SDK packages
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-35,build-tools;35.0.0,ndk;27.0.12077973"

      - name: Export NDK path for cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls $ANDROID_SDK_ROOT/ndk | head -n1)" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=android-35" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-35/android.jar" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Check TTS bridge + UI for Android targets
        run: |
          cargo ndk -t arm64-v8a -t x86_64 check -p reeda-tts --no-default-features --features platform-android
          cargo ndk -t arm64-v8a -t x86_64 check -p reeda-ui --no-default-features --features platform-android
        env:
          ANDROID_PLATFORM: android-35