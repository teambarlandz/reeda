[package]
name = "reeda-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reeda read-aloud: narration engine + Android TextToSpeech JNI bridge (docs/TTS_SPEC.md)."

[features]
default = ["platform-desktop"]
platform-desktop = []   # stub host platform for dev builds
platform-android = ["dep:jni", "dep:ndk-context"]   # JNI bridge to android.speech.tts.TextToSpeech

[dependencies]
reeda-epub = { path = "../reeda-epub" }
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Media_Core",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_Foundation",
]}

[lints.clippy]
undocumented_unsafe_blocks = "deny"
