[package]
name = "reeda-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reeda app core: domain models, app state, command bus, services."

[dependencies]
reeda-epub = { path = "../reeda-epub" }
reeda-pdf = { path = "../reeda-pdf" }
reeda-search = { path = "../reeda-search" }
reeda-tts = { path = "../reeda-tts" }
tantivy = { version = "0.26.1", default-features = false, features = ["mmap"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
zip = "2"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
