[workspace]
resolver = "2"
members = [
    "crates/reeda-core",
    "crates/reeda-epub",
    "crates/reeda-pdf",
    "crates/reeda-search",
    "crates/reeda-tts",
    "crates/reeda-ui",
]

[workspace.lints.clippy]
# Every unsafe block must carry a SAFETY comment (DRM_SECURITY.md §5).
undocumented_unsafe_blocks = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["teambarlandz"]
# license: TBD — ADR OQ-1, decided in M0
repository = "https://github.com/teambarlandz/reeda"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reeda-core = { path = "crates/reeda-core" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
